    <line x1="-4" y1="14" x2="4" y2="14" stroke="#0B2447" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="-4" x2="14" y2="4" stroke="#0B2447" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-14" y1="-4" x2="-14" y2="4" stroke="#0B2447" stroke-width="1.5" stroke-linecap="round"/>
